plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    // kotlin-android removed: AGP 8.11+ provides built-in Kotlin.
    // No separate KGP needed. This eliminates the "Kotlin Gradle Plugin"
    // warnings and prepares for AGP 9.0 compliance.
}

android {
    namespace = "com.streakitapp.streak_it"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    // kotlinOptions block removed — not needed without explicit KGP.
    // AGP built-in Kotlin uses the project-level Kotlin version automatically.

    defaultConfig {
        applicationId = "com.streakitapp.streak_it"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required for flutter_local_notifications API desugaring (Android < 26)
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
