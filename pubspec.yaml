name: streak_it
description: "Streak It — A brutalist habit tracker. Dark mode first, offline-first, AI coaching, deep journaling, full widget suite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^3.2.1

  # FIREBASE (Dev/Prod split)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1
  google_sign_in: ^6.3.0

  # LOCAL DATABASE (Offline-First)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # WIDGETS & HOME SCREEN
  home_widget: ^0.7.0
  workmanager: ^0.5.2

  # NOTIFICATIONS
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # CHARTS & VISUALIZATION
  fl_chart: ^1.2.0
  contribution_heatmap: ^0.5.3

  # ANIMATIONS
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1

  # UTILITIES
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.19.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  permission_handler: ^12.0.1
  flutter_native_splash: ^2.4.4
  google_fonts: ^6.2.1

  # ON-DEVICE ML (AI Coach)
  flutter_litert: ^0.2.0

  # BIOMETRIC LOCK
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^3.2.1
  isar_community_generator: ^3.3.2
  freezed: ^2.5.8
  json_serializable: ^6.9.3
  mockito: ^5.4.5
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "brand/streak_it_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "brand/streak_it_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: brand/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: StreakIt
      fonts:
        - asset: assets/fonts/StreakIt-Bold.ttf
          weight: 700
        - asset: assets/fonts/StreakIt-Regular.ttf
          weight: 400