name: streak_it
description: "Streak It — A premium habit tracker with real analytics, streaks, and tasks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1
  # riverpod_annotation / riverpod_generator removed — we use manual providers, not codegen

  # ── Database (reactive SQLite) ────────────────────────────────────────────
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  # sqlite3_flutter_libs removed — drift_flutter 0.3.0 bundles SQLite natively (EOL package)
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── Charts & Visualization ────────────────────────────────────────────────
  fl_chart: ^1.2.0

  # ── Animations ────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.2

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # ── Biometrics ────────────────────────────────────────────────────────────
  local_auth: ^3.0.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  share_plus: ^13.1.0
  permission_handler: ^12.0.3

  # ── Default Flutter ───────────────────────────────────────────────────────
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  # riverpod_generator removed — not used in codebase

  # ── Linting ───────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Testing ───────────────────────────────────────────────────────────────
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
